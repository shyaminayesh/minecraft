name: build

on:
  push:
    branches:
      - dev

jobs:

  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: ghcr::login
        uses: docker/login-action@v3
        with:
         registry: ghcr.io
         username: ${{ github.actor }}
         password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker::build
        run:
          docker build . --tag ghcr.io/shyaminayesh/minecraft:1.21.10

      - name: docker::publish
        run:
          docker push ghcr.io/shyaminayesh/minecraft:1.21.10